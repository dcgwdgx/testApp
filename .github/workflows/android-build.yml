name: Android Build + Submit

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/workflows/ios-build.yml'
      - '*.md'
      - '*.html'
      - '*.mp4'
      - 'screenshots/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android
        run: eas build --platform android --profile preview --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to Google Play
        if: github.ref == 'refs/heads/master'
        run: |
          APK=$(find . -name "*.aab" -type f | head -1)
          echo "Submitting $APK"
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > /tmp/google-play-key.json
          eas submit --platform android --path="$APK" --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PetPortraitAI-APK
          path: '**/*.aab'
